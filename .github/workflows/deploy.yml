name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub Pages serves static files only, so the chat API route (needs a server) is left out of this
      # build. The chat widget instead calls the server set in the CHAT_API_URL repository variable.
      - run: rm -rf src/app/api
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /BHAVNA-J
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
